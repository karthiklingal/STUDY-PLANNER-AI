<svg width="680" height="200" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Process workflow diagram</title>
<desc>Student enters subjects and deadlines, the agent generates a study plan, the classifier flags at-risk subjects, and the student receives a final personalized plan.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="200" fill="#FFFFFF"/>

<rect x="20" y="70" width="130" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="85" y="94" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#2C2C2A">Enter subjects</text>
<text x="85" y="112" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#5F5E5A">&amp; deadlines</text>

<line x1="150" y1="98" x2="182" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="182" y="70" width="130" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="247" y="94" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#04342C">Generate plan</text>
<text x="247" y="112" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#0F6E56">A* search</text>

<line x1="312" y1="98" x2="344" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="344" y="70" width="130" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="409" y="94" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#4A1B0C">Check prereqs</text>
<text x="409" y="112" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#993C1D">Knowledge base</text>

<line x1="474" y1="98" x2="506" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="506" y="70" width="130" height="56" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="571" y="94" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#4B1528">Flag risk &amp;</text>
<text x="571" y="112" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#993556">insights (ML)</text>

<text x="340" y="160" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#5F5E5A">Output: personalized day-by-day study plan with risk flags and prerequisite notes</text>
</svg>
