<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Use case diagram</title>
<desc>The student actor interacts with four use cases: generate study plan, query prerequisites, view risk prediction, and submit feedback notes.</desc>
<rect x="0" y="0" width="680" height="320" fill="#FFFFFF"/>

<!-- Actor: stick figure -->
<circle cx="60" cy="60" r="14" fill="none" stroke="#2C2C2A" stroke-width="1.5"/>
<line x1="60" y1="74" x2="60" y2="120" stroke="#2C2C2A" stroke-width="1.5"/>
<line x1="60" y1="90" x2="35" y2="110" stroke="#2C2C2A" stroke-width="1.5"/>
<line x1="60" y1="90" x2="85" y2="110" stroke="#2C2C2A" stroke-width="1.5"/>
<line x1="60" y1="120" x2="38" y2="150" stroke="#2C2C2A" stroke-width="1.5"/>
<line x1="60" y1="120" x2="82" y2="150" stroke="#2C2C2A" stroke-width="1.5"/>
<text x="60" y="170" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#2C2C2A">Student</text>

<!-- System boundary -->
<rect x="200" y="20" width="440" height="280" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<text x="420" y="42" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#5F5E5A">Study Planner System</text>

<!-- Use case ellipses -->
<ellipse cx="330" cy="90" rx="100" ry="30" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="330" y="95" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#04342C">Generate study plan</text>

<ellipse cx="330" cy="160" rx="100" ry="30" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="330" y="165" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#4A1B0C">Query prerequisites</text>

<ellipse cx="330" cy="230" rx="100" ry="30" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="330" y="235" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#4B1528">View risk prediction</text>

<ellipse cx="530" cy="230" rx="90" ry="30" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="530" y="235" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#4B1528">Submit feedback note</text>

<!-- Actor connections -->
<line x1="88" y1="110" x2="230" y2="90" stroke="#5F5E5A" stroke-width="1"/>
<line x1="88" y1="120" x2="230" y2="160" stroke="#5F5E5A" stroke-width="1"/>
<line x1="88" y1="140" x2="230" y2="225" stroke="#5F5E5A" stroke-width="1"/>
</svg>
