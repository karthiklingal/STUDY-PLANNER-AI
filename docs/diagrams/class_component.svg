<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Class / component diagram</title>
<desc>Shows the SearchAgent, KnowledgeBase, RiskClassifier, StudentClusterer, and SentimentAnalyzer classes and their key methods.</desc>
<rect x="0" y="0" width="680" height="360" fill="#FFFFFF"/>

<!-- SearchAgent -->
<rect x="30" y="30" width="220" height="90" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="140" y="48" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#04342C">SearchAgent</text>
<line x1="30" y1="56" x2="250" y2="56" stroke="#0F6E56" stroke-width="0.5"/>
<text x="40" y="74" font-size="12" font-family="monospace" fill="#0F6E56">+plan_schedule()</text>
<text x="40" y="90" font-size="12" font-family="monospace" fill="#0F6E56">+print_plan()</text>
<text x="40" y="106" font-size="12" font-family="monospace" fill="#0F6E56">-_days_until()</text>

<!-- KnowledgeBase -->
<rect x="30" y="150" width="220" height="110" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="140" y="168" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#4A1B0C">KnowledgeBase</text>
<line x1="30" y1="176" x2="250" y2="176" stroke="#993C1D" stroke-width="0.5"/>
<text x="40" y="194" font-size="12" font-family="monospace" fill="#993C1D">+query_prerequisites()</text>
<text x="40" y="210" font-size="12" font-family="monospace" fill="#993C1D">+all_prerequisites()</text>
<text x="40" y="226" font-size="12" font-family="monospace" fill="#993C1D">+can_skip()</text>
<text x="40" y="242" font-size="12" font-family="monospace" fill="#993C1D">+what_to_study_before()</text>

<!-- RiskClassifier -->
<rect x="430" y="30" width="220" height="90" rx="6" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="540" y="48" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#4B1528">RiskClassifier</text>
<line x1="430" y1="56" x2="650" y2="56" stroke="#993556" stroke-width="0.5"/>
<text x="440" y="74" font-size="12" font-family="monospace" fill="#993556">+train_model()</text>
<text x="440" y="90" font-size="12" font-family="monospace" fill="#993556">+predict_risk()</text>

<!-- StudentClusterer -->
<rect x="430" y="140" width="220" height="70" rx="6" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="540" y="158" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#4B1528">StudentClusterer</text>
<line x1="430" y1="166" x2="650" y2="166" stroke="#993556" stroke-width="0.5"/>
<text x="440" y="184" font-size="12" font-family="monospace" fill="#993556">+cluster_students()</text>

<!-- SentimentAnalyzer -->
<rect x="430" y="230" width="220" height="70" rx="6" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="540" y="248" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#4B1528">SentimentAnalyzer</text>
<line x1="430" y1="256" x2="650" y2="256" stroke="#993556" stroke-width="0.5"/>
<text x="440" y="274" font-size="12" font-family="monospace" fill="#993556">+analyze()</text>

<!-- Orchestrator -->
<rect x="230" y="130" width="150" height="60" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="305" y="155" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#26215C">CLI Orchestrator</text>
<text x="305" y="172" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#534AB7">main.py</text>

<line x1="230" y1="150" x2="252" y2="130" stroke="#5F5E5A" stroke-width="1"/>
<line x1="230" y1="165" x2="252" y2="200" stroke="#5F5E5A" stroke-width="1"/>
<line x1="380" y1="150" x2="430" y2="90" stroke="#5F5E5A" stroke-width="1"/>
<line x1="380" y1="160" x2="430" y2="175" stroke="#5F5E5A" stroke-width="1"/>
<line x1="380" y1="170" x2="430" y2="265" stroke="#5F5E5A" stroke-width="1"/>
</svg>
