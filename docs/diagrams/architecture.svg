<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>System architecture diagram</title>
<desc>User interacts with CLI, which calls three modules: planning agent, knowledge base, and ML pipeline, all reading from a shared data store.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="360" fill="#FFFFFF"/>

<!-- User -->
<rect x="280" y="20" width="120" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="46" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#2C2C2A">Student (user)</text>
<line x1="340" y1="64" x2="340" y2="96" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- CLI layer -->
<rect x="240" y="96" width="200" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="122" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#26215C">CLI (main.py)</text>

<line x1="290" y1="140" x2="150" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="140" x2="340" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="390" y1="140" x2="540" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Planning agent -->
<rect x="50" y="180" width="200" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="150" y="202" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#04342C">Planning agent</text>
<text x="150" y="220" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#0F6E56">A* search scheduling</text>

<!-- Knowledge base -->
<rect x="240" y="180" width="200" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="202" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#4A1B0C">Knowledge base</text>
<text x="340" y="220" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#993C1D">Prolog-style rules</text>

<!-- ML pipeline -->
<rect x="440" y="180" width="200" height="56" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="540" y="202" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#4B1528">ML pipeline</text>
<text x="540" y="220" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#993556">Classify · cluster · sentiment</text>

<!-- Data store -->
<line x1="150" y1="236" x2="330" y2="276" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="236" x2="340" y2="276" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="540" y1="236" x2="360" y2="276" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="240" y="276" width="200" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="296" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#2C2C2A">Data store</text>
<text x="340" y="313" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#5F5E5A">sample_students.csv</text>
</svg>
